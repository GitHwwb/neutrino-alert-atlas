name: update-events

on:
  schedule:
    # IceCube alerts arrive roughly weekly; a three-hour poll limits staleness.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/test_geometry.js
          node --check web/geometry.js
          node --check web/app.js

      - name: Fetch and validate catalog
        run: |
          python scripts/fetch_events.py
          python scripts/fetch_events.py --validate-only

      - name: Commit catalog content changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/events.json
          if git diff --cached --quiet; then
            echo "No catalog content changes."
          else
            git commit -m "Update events.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          expected="$(python -c 'import json; print(json.load(open("web/data/events.json"))["generated_at_utc"])')"
          for attempt in $(seq 1 12); do
            deployed="$(
              curl --fail --silent --show-error \
                -H "Cache-Control: no-cache" \
                "${PAGE_URL}data/events.json?run=${GITHUB_RUN_ID}&attempt=${attempt}" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["generated_at_utc"])'
            )" || true
            if [ "$deployed" = "$expected" ]; then
              echo "Verified deployed dataset generated at $deployed"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed dataset did not match generated artifact." >&2
          exit 1
