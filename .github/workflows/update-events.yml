name: update-events

on:
  schedule:
    # Every 3 hours. IceCube alerts arrive ~once a week, so this is generous.
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-events.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch and precompute
        run: python scripts/fetch_events.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet web/data/events.json; then
            echo "No changes to events.json."
          else
            git add web/data/events.json
            git commit -m "Update events.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
